<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <!-- Preload de conexão de fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/f8c32f1a2a.js" crossorigin="anonymous" defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        :root {
            --color-white: #FFF;
            --color-primary-rgb: rgb(136, 93, 200);
            --color-secondary-rgb: rgba(255, 255, 255, .4);
            --color-description-rgb: rgba(255,255,255,.6);
        }

        body {
            font-size: 16px;
        }

        html,
        body {
            overflow-x: hidden;
            min-height: 100%;
        }

        h1, h2, h3, footer {
            font-family: 'Poppins', sans-serif;
        }

        body, p, textarea {
            font-family: 'Inter', sans-serif;
        }

        .auth-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            background-size: 300% 300%;
            animation: gradient 10s ease infinite;
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        .section-form {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            min-height: 100vh;
        }

        .form-auth {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            background-color: rgba(255, 255, 255, 0.09);
            max-width: 440px;
            width: 100%;
            padding: 30px;
            border-radius: 30px;
            border: 1px solid rgba(243, 243, 243, 0.1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.10);
        }

        .form-top {
            display: flex;
            flex-direction: column;
            align-items: center;  
            gap: 20px;
            width: 100%;
        }

        .form-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: calc(100% - 40px);
            padding: 20px;
            border-bottom: 1px solid rgba(232, 232, 232, 0.2);
        }

        .title-form {
            color: var(--color-white);
            font-size: 26px;
            font-weight: 500;
        }

        .form-description {
            max-width: 300px;
            text-align: center;
        }

        .description {
            font-size: 17px;
            color: var(--color-description-rgb);
        }

        .form-body {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-content {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 10px;
        }

        .text-form {
            font-size: 16px;
            font-weight: 500;
            color: var(--color-white);
        }

        .form-input {
            color: var(--color-white);
            font-size: 16px;
            font-weight: 500;
            padding: 0 12px;
            min-height: 48px;
            max-height: 48px;
            min-width: 250px;
            outline: none;
            background: transparent;
            border: 3px solid rgb(130, 146, 174);
            border-radius: 10px;
            transition: 0.1s ease;
        }

        .form-input:hover {
            border-color: rgb(184, 208, 249);
        }

        .form-input::placeholder {
            color: rgb(255, 255, 255, .4); 
            font-size: 17px;
        }

        .form-input:focus {
            border-color: rgb(136, 93, 200);
            outline: none;
        }

        .form-error {
            color: rgba(237, 57, 57, 0.9);
            font-size: 13px;
            margin-top: 6px;
        }

        .form-error ul {
            list-style: none;
        }

        .forgot-password {
            
        }
        
        .forgot-password-link {
            color: var(--color-white);
            text-decoration: none;
        }

        .forgot-password-link:hover {
            text-decoration: underline;
        }

        .btn-form {
            margin: 0 auto;
            width: 100%;
        }

        .btn-input-style {
            position: relative;
            overflow: hidden;
            color: var(--color-white);
            background-color: rgb(136, 93, 200);
            width: 100%;
            border-radius: 999px;
            border: 1px solid rgba(232, 232, 232, 0.2);
            padding: 14px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-input-style::before {
            content: "";
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(120deg, transparent, var(--color-secondary-rgb), transparent);
            transform: skewX(-20deg);
            transition: transform 0.2s ease;
        }

        .btn-input-style:hover {
            background-color: rgb(123, 81, 184);
            transform: scale(1.02);
            transition: all .2s ease;
        }
        
        .btn-input-style:hover::before {
            animation: shine 0.8s ease forwards;
        }

        @keyframes shine {
            0% {
                left: -75%;
            }
            100% {
                left: 125%;
            }
        }

        .signup {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .signup-text {
            font-size: 16px;
            color: var(--color-secondary-rgb);
        }

        .signup-link {
            color: var(--color-primary-rgb);
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .signup-link:hover {
            color: var(--color-secondary-rgb);
            text-decoration: underline;
        }

        /* Error message */

        .error {
            display: flex;
            justify-content: center;
            gap: 10px;
            background-color: rgba(236, 94, 94, 0.4);
            padding: 16px;
            border-radius: 10px;
            border: 2px solid rgba(236, 94, 94, 0.9);
        }

        .error i {
            font-size: 20px;
            color: rgba(236, 94, 94, 0.9);
        }

        .error-message {
            color: #fff;
            font-size: 15px;
            line-height: 1.3;
        }
        
        </style>

{% block extra_css %}{% endblock %}
    
</head>
<body>
    <main role="main" class="auth-page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
